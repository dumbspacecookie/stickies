# Stickies reconciliation — converge every cloud session's notes into one board.
#
# Cloud sessions can only push to their own claude/* branch, never to main. This
# workflow runs when such a branch pushes a note change, merges just that note into
# main via the repo's own engine (union + dismiss-wins + dedupe), and pushes main.
# The result: notes written from any device end up on a single board automatically.
#
# Installed by `stickies init-repo`. Only ever touches .stickies/ — never your code.
name: stickies-sync
on:
  push:
    branches:
      - 'claude/**'
      - 'stickies/**'
    paths:
      - '.stickies/notes.json'
permissions:
  contents: write
concurrency:
  group: stickies-sync        # serialize merges so two branches can't race main
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # The job pushes with an explicit token below; it does not need the checkout action to
          # leave credentials in .git/config where any later step — or anything this job runs —
          # could read them.
          persist-credentials: false
      - name: Merge notes from the triggering branch into main
        env:
          # A branch name reaches this job as attacker-controlled text: `git check-ref-format`
          # accepts `claude/x$(id)y`, and `${{ }}` is substituted into the script BEFORE bash
          # parses it — so interpolating it inline was arbitrary command execution on the runner,
          # holding a token with `contents: write`. Through env it is data: bash expands "$REF"
          # after parsing, and never re-parses the result.
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Defence in depth: even as data, refuse a ref that is not a plain branch name.
          case "$REF" in
            *[!A-Za-z0-9._/-]*) echo "refusing unusual branch name"; exit 1 ;;
          esac
          # The triggering branch isn't reachable from main — fetch it, then read its store.
          git fetch --no-tags origin "$REF"
          git show "origin/$REF:.stickies/notes.json" > /tmp/incoming.json 2>/dev/null || { echo "no notes on branch"; exit 0; }
          node .stickies/engine.mjs reconcile /tmp/incoming.json
          if git diff --quiet -- .stickies/; then
            echo "no change after reconcile"; exit 0
          fi
          git config user.name  "stickies-bot"
          git config user.email "stickies@users.noreply.github.com"
          git add .stickies/
          # -F - : the branch name goes in on stdin, so it is never part of a command line.
          printf 'stickies: reconcile notes from %s\n' "$REF" | git commit -F -
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
